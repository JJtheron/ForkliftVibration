# Request and connection limits
limit_req_zone $binary_remote_addr zone=web_limit:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=120r/m;
limit_conn_zone $binary_remote_addr zone=connection_limit:10m;

# Redirect HTTP to HTTPS
server {
    listen 80;
    server_name forklift-tracker.local;

    return 301 https://$host$request_uri;
}

# HTTPS server
server {
    listen 443 ssl;
    server_name forklift-tracker.local;

    server_tokens off;

    ssl_certificate /etc/nginx/certs/nginx.crt;
    ssl_certificate_key /etc/nginx/certs/nginx.key;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m;
    ssl_session_tickets off;

    # Replace with your actual yard or mill network.
    allow 127.0.0.1;
    allow 10.252.204.0/24;
    allow 10.182.64.0/22;
    allow 10.182.68.0/23;
    deny all;

    auth_basic "Forklift Vibration Tracker";
    auth_basic_user_file /etc/nginx/auth/.htpasswd;

    limit_conn connection_limit 10;

    # Browser security headers
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "geolocation=(), camera=(), microphone=()" always;

    # Enable only after clients trust the certificate.
    add_header Strict-Transport-Security "max-age=31536000" always;

    # Block dotfiles such as .env, .git and .htpasswd
    location ~ /\.(?!well-known) {
        deny all;
        return 404;
    }

    location / {
        limit_req zone=web_limit burst=20 nodelay;

        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ =404;
    }

    location /api/ {
        limit_req zone=api_limit burst=30 nodelay;

        proxy_pass http://python-app:5000;

        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 5s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;

        client_max_body_size 1m;
    }
}