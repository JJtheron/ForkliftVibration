# Automatically upgrade HTTP to HTTPS locally
server {
    listen 80;
    server_name _; # Responds to any IP address or hostname

    location / {
        return 301 https://$host$request_uri; 
    }
}

# Secure Local HTTPS Server Block
server {
    listen 443 ssl;
    server_name _;

    # Point to the local self-signed certificate keys mapped into Nginx
    ssl_certificate /etc/nginx/certs/nginx.crt;
    ssl_certificate_key /etc/nginx/certs/nginx.key;

    # Secure Protocol settings
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    # Global Password Authentication
    auth_basic           "DietPi Local Secure Gateway";
    auth_basic_user_file /usr/share/nginx/html/.htpasswd;

    # Serve static frontend web files
    location / {
        root   /usr/share/nginx/html;
        index  index.html index.htm;
    }

    # Reverse Proxy: Securely forward all data queries internally to Python
    location /api/ {
        proxy_pass http://python-app:5000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}