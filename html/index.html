<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>DietPi Live Dashboard</title>
    <style>
        body { font-family: sans-serif; margin: 40px; background: #f4f4f9; color: #333; }
        table { width: 100%; border-collapse: collapse; margin-top: 20px; background: white; }
        th, td { padding: 12px; text-align: left; border-bottom: 1px solid #ddd; }
        th { background-color: #007BFF; color: white; }
        .temp-badge { background: #E3F2FD; color: #0D47A1; padding: 4px 8px; border-radius: 4px; font-weight: bold; }
    </style>
</head>
<body>
    <h1>Raspberry Pi Hardware Database Log</h1>
    <button onclick="fetchData()">Refresh Manually</button>
    
    <table>
        <thead>
            <tr>
                <th>Timestamp</th>
                <th>Sensor Value</th>
                <th>Pi CPU Temperature</th>
            </tr>
        </thead>
        <tbody id="data-table">
            <tr><td colspan="3">Loading database telemetry...</td></tr>
        </tbody>
    </table>

    <script>
        async function fetchData() {
            try {
                const response = await fetch('/api/data');
                const data = await response.json();
                
                const tbody = document.getElementById('data-table');
                tbody.innerHTML = '';
                
                if (data.length === 0) {
                    tbody.innerHTML = '<tr><td colspan="3">No records found in database yet.</td></tr>';
                    return;
                }

                data.forEach(row => {
                    const tr = document.createElement('tr');
                    tr.innerHTML = `
                        <td>${row.timestamp}</td>
                        <td>${row.value}</td>
                        <td><span class="temp-badge">${row.cpu_temp} °C</span></td>
                    `;
                    tbody.appendChild(tr);
                });
            } catch (err) {
                console.error("Failed fetching data:", err);
            }
        }

        setInterval(fetchData, 5000);
        window.onload = fetchData;
    </script>
</body>
</html>
