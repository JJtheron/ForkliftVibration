services:
  mysql-server:
    image: yobasystems/alpine-mariadb:latest
    container_name: mysql-server
    restart: unless-stopped
    command: ["--init-file=/docker-entrypoint-initdb.d/Database_schema.sql"]
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD: ${DB_PASSWORD}
    volumes:
      - /mnt/ubs1/mysql:/var/lib/mysql
      - ./SQL/Database_schema.sql:/docker-entrypoint-initdb.d/Database_schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "mariadb-admin ping -h 127.0.0.1 -uroot -p\"$$MARIADB_ROOT_PASSWORD\" --silent"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 20s
    networks:
      - backend

  web-server:
    image: nginx:alpine
    container_name: html-web-server
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./html:/usr/share/nginx/html:ro
      - ./html/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./certs:/etc/nginx/certs:ro
      - ./auth/.htpasswd:/etc/nginx/auth/.htpasswd:ro
    networks:
      - frontend

  python-app:
    build: ./python
    container_name: python-environment
    restart: unless-stopped
    environment:
      PYTHONUNBUFFERED: "1"
      DB_HOST: mysql-server
      DB_PORT: "3306"
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
    volumes:
      - ./python:/app
      - ./data:/data
      - /sys:/sys:ro
    devices:
      - "/dev/gpiomem:/dev/gpiomem"
      - "/dev/gpiochip0:/dev/gpiochip0"
      - "/dev/i2c-1:/dev/i2c-1"
      - "/dev/serial0:/dev/serial0"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    networks:
      - frontend
      - backend
    depends_on:
      mysql-server:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import pymysql; pymysql.connect(host='mysql-server', port=3306, user='${DB_USER}', password='${DB_PASSWORD}', database='${DB_NAME}', connect_timeout=3).close()\""]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

networks:
  frontend:
  backend:
    internal: true